version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: case_study_app
    ports:
      - "9000:9000"
    volumes:
      - ./src:/app/src
      - ./inversify.config.ts:/app/inversify.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
      - /app/dist
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: your_password
      DATABASE_NAME: case_study_db
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      JWT_EXPIRES_IN: 24h
      PORT: 9000
    depends_on:
      postgres:
        condition: service_healthy
    command: yarn dev:docker

  postgres:
    image: postgres:16-alpine
    container_name: case_study_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: case_study_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
